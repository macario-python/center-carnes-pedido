<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Center Carnes Boizão Du Capricho — Pedido para retirada</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3C0E0A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Center Carnes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --wine-900:#3C0E0A;
  --wine-700:#6B1B12;
  --bone:#F2E9DC;
  --bone-2:#FFFFFF;
  --charcoal:#241C18;
  --mustard:#C68A2E;
  --line:rgba(36,28,24,0.16);
  --radius:10px;
  --serif:'Roboto Slab', Georgia, serif;
  --sans:'Work Sans','Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--sans);
  background:var(--bone);
  color:var(--charcoal);
  -webkit-font-smoothing:antialiased;
}
header{
  background:var(--wine-900);
  color:var(--bone-2);
  padding:28px 20px 24px;
  text-align:center;
}
header h1{
  font-family:var(--serif);
  font-weight:700;
  font-size:26px;
  margin:0 0 6px;
  letter-spacing:0.2px;
}
header p{
  margin:0;
  font-size:14px;
  color:rgba(242,233,220,0.82);
}
header .logo-marca{
  width:100%;
  max-width:280px;
  height:auto;
  margin:0 auto 10px;
  display:block;
  border-radius:10px;
}
main{
  max-width:640px;
  margin:-18px auto 40px;
  padding:0 16px;
}
.card{
  background:var(--bone-2);
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px 20px;
}
label{
  display:block;
  font-size:13px;
  font-weight:500;
  color:var(--charcoal);
  margin:0 0 6px;
}
input[type="text"],input[type="tel"],input[type="date"],input[type="number"],select{
  width:100%;
  height:44px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:0 12px;
  font-size:15px;
  font-family:var(--sans);
  color:var(--charcoal);
  background:var(--bone-2);
}
input:focus,select:focus{
  outline:none;
  border-color:var(--wine-700);
}
.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:16px;
}
.field{margin-bottom:16px;}
.periodo-opcoes{display:flex;gap:8px;}
.periodo-btn{
  flex:1;
  height:44px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--bone-2);
  font-family:var(--sans);
  font-size:15px;
  cursor:pointer;
}
.periodo-btn.ativo{
  border:2px solid var(--wine-700);
  background:rgba(107,27,18,0.06);
  color:var(--wine-700);
  font-weight:500;
}
.itens-titulo{
  font-family:var(--serif);
  font-size:16px;
  font-weight:500;
  margin:24px 0 12px;
  color:var(--wine-900);
}
.item-row{
  display:grid;
  grid-template-columns:1.8fr 0.8fr 1fr 1.6fr;
  gap:8px;
  margin-bottom:8px;
}
.item-row input,.item-row select{font-size:14px;padding:0 8px;}
#add-item{
  margin-top:4px;
  height:40px;
  padding:0 16px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--bone-2);
  font-family:var(--sans);
  font-size:14px;
  cursor:pointer;
}
.erro{
  color:#A32D2D;
  font-size:13px;
  margin:-10px 0 14px;
  display:none;
}
#btn-enviar{
  width:100%;
  height:50px;
  margin-top:24px;
  border:none;
  border-radius:var(--radius);
  background:var(--wine-700);
  color:var(--bone-2);
  font-family:var(--sans);
  font-size:16px;
  font-weight:500;
  cursor:pointer;
}
#btn-enviar:active{transform:scale(0.99);}
#btn-enviar:disabled{opacity:0.6;cursor:default;}
.confirmacao{
  display:none;
  text-align:center;
  padding:20px 0;
}
.confirmacao h2{
  font-family:var(--serif);
  color:var(--wine-900);
  font-size:20px;
  margin:0 0 8px;
}
.produto-wrap{position:relative;}
.sugestoes{
  display:none;
  position:absolute;
  top:calc(100% + 4px);
  left:0;
  right:0;
  background:var(--wine-900);
  border:1px solid var(--wine-900);
  border-radius:8px;
  max-height:180px;
  overflow-y:auto;
  z-index:20;
}
.sugestao-item{
  padding:10px 12px;
  font-size:14px;
  color:var(--bone-2);
  cursor:pointer;
}
.sugestao-item:hover,.sugestao-item:active{background:var(--wine-700);}
.aviso-ios{
  display:none;
  background:var(--wine-900);
  color:var(--bone-2);
  font-size:13px;
  padding:10px 16px;
  text-align:center;
}
.aviso-ios button{
  background:none;
  border:none;
  color:var(--bone-2);
  text-decoration:underline;
  font-size:13px;
  margin-left:8px;
  cursor:pointer;
}
.confirmacao p{
  color:var(--charcoal);
  font-size:15px;
  margin:0;
}
#btn-sair{
  margin-top:20px;
  height:44px;
  padding:0 24px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--bone-2);
  font-family:var(--sans);
  font-size:15px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="aviso-ios" id="aviso-ios">
  Instale este app: toque em Compartilhar e depois em "Adicionar à Tela de Início".
  <button type="button" id="fechar-aviso-ios">Fechar</button>
</div>

<div class="aviso-ios" id="aviso-android">
  Instale este app na tela inicial pra pedir mais rápido da próxima vez.
  <button type="button" id="btn-instalar-android">Instalar</button>
  <button type="button" id="fechar-aviso-android">Agora não</button>
</div>

<header>
  <img src="logo-header.png" alt="Center Carnes Boizão Du Capricho" class="logo-marca">
  <p>Pedido para retirada</p>
</header>

<main>
  <div class="card">

    <form id="form-pedido">
      <div class="row2">
        <div>
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Seu nome">
        </div>
        <div>
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" placeholder="(11) 99999-0000">
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="data-retirada">Data de retirada</label>
          <input type="date" id="data-retirada">
        </div>
        <div>
          <label>Período</label>
          <div class="periodo-opcoes">
            <button type="button" class="periodo-btn" id="btn-manha">Manhã</button>
            <button type="button" class="periodo-btn" id="btn-tarde">Tarde</button>
          </div>
        </div>
      </div>

      <p class="itens-titulo">Itens do pedido</p>
      <div id="itens-lista"></div>
      <button type="button" id="add-item">+ Adicionar item</button>

      <p class="erro" id="msg-erro"></p>

      <button type="submit" id="btn-enviar">Enviar pedido</button>
    </form>

    <div class="confirmacao" id="confirmacao">
      <h2>Pedido enviado!</h2>
      <p>O açougue recebeu seu pedido e já está preparando.</p>
      <button type="button" id="btn-sair">Sair</button>
    </div>

  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = "https://szkknvtqptdeffknnllx.supabase.co";
var SUPABASE_KEY = "sb_publishable_nw_LqaqXO9gcF8ybA3vrVg_qtYfATdE";
var CANAL_PEDIDOS = "acougue-center-carnes-pedidos";

if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}

var ehIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
var jaInstalado = window.navigator.standalone === true;
var avisoFechado = localStorage.getItem("avisoIosFechado") === "1";

if (ehIOS && !jaInstalado && !avisoFechado){
  document.getElementById("aviso-ios").style.display = "block";
}
document.getElementById("fechar-aviso-ios").addEventListener("click", function(){
  document.getElementById("aviso-ios").style.display = "none";
  localStorage.setItem("avisoIosFechado", "1");
});

var promptInstalacao = null;
var avisoAndroidFechado = localStorage.getItem("avisoAndroidFechado") === "1";

window.addEventListener("beforeinstallprompt", function(evento){
  evento.preventDefault();
  promptInstalacao = evento;
  if (!avisoAndroidFechado){
    document.getElementById("aviso-android").style.display = "block";
  }
});

document.getElementById("btn-instalar-android").addEventListener("click", function(){
  document.getElementById("aviso-android").style.display = "none";
  if (promptInstalacao){
    promptInstalacao.prompt();
    promptInstalacao.userChoice.then(function(){ promptInstalacao = null; });
  }
});

document.getElementById("fechar-aviso-android").addEventListener("click", function(){
  document.getElementById("aviso-android").style.display = "none";
  localStorage.setItem("avisoAndroidFechado", "1");
});

document.getElementById("btn-sair").addEventListener("click", function(){
  window.close();
  document.getElementById("confirmacao").innerHTML =
    "<h2>Pedido enviado!</h2><p>Pode fechar esta aba agora.</p>";
});

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var canal = supabaseClient.channel(CANAL_PEDIDOS);
canal.subscribe();

var produtos = [
  "Picanha",
  "Alcatra",
  "Fraldinha",
  "Contrafilé",
  "Costela bovina",
  "Cupim",
  "Maminha",
  "Coxão mole",
  "Coxão duro",
  "Patinho",
  "Acém",
  "Carne moída",
  "Linguiça toscana",
  "Linguiça calabresa",
  "Bisteca suína",
  "Lombo suíno",
  "Frango inteiro",
  "Coxa e sobrecoxa",
  "Bacon"
];

var itensLista = document.getElementById("itens-lista");

function criarLinhaItem(){
  var linha = document.createElement("div");
  linha.className = "item-row";
  linha.innerHTML =
    '<div class="produto-wrap">' +
      '<input type="text" class="item-produto" placeholder="Picanha, fraldinha, linguiça..." autocomplete="off">' +
      '<div class="sugestoes"></div>' +
    '</div>' +
    '<input type="number" step="0.1" min="0" class="item-qtd" placeholder="Qtd">' +
    '<select class="item-unidade"><option value="Kg">Kg</option><option value="Unidade">Unidade</option><option value="Peça">Peça</option></select>' +
    '<input type="text" class="item-obs" placeholder="Sem osso, moída na hora...">';
  itensLista.appendChild(linha);
}
for (var i = 0; i < 5; i++){ criarLinhaItem(); }
document.getElementById("add-item").addEventListener("click", criarLinhaItem);

function fecharTodasSugestoes(){
  document.querySelectorAll(".sugestoes").forEach(function(lista){
    lista.style.display = "none";
    lista.innerHTML = "";
  });
}

itensLista.addEventListener("input", function(evento){
  if (!evento.target.classList.contains("item-produto")){ return; }
  var input = evento.target;
  var wrap = input.closest(".produto-wrap");
  var lista = wrap.querySelector(".sugestoes");
  var termo = input.value.trim().toLowerCase();
  fecharTodasSugestoes();
  if (!termo){ return; }
  var resultados = produtos.filter(function(p){
    return p.toLowerCase().indexOf(termo) !== -1;
  }).slice(0, 6);
  if (resultados.length === 0){ return; }
  resultados.forEach(function(p){
    var opcao = document.createElement("div");
    opcao.className = "sugestao-item";
    opcao.textContent = p;
    lista.appendChild(opcao);
  });
  lista.style.display = "block";
});

itensLista.addEventListener("click", function(evento){
  if (!evento.target.classList.contains("sugestao-item")){ return; }
  var wrap = evento.target.closest(".produto-wrap");
  wrap.querySelector(".item-produto").value = evento.target.textContent;
  fecharTodasSugestoes();
});

document.addEventListener("click", function(evento){
  if (!evento.target.closest(".produto-wrap")){ fecharTodasSugestoes(); }
});

var periodoSelecionado = null;
var btnManha = document.getElementById("btn-manha");
var btnTarde = document.getElementById("btn-tarde");

function selecionarPeriodo(valor){
  periodoSelecionado = valor;
  btnManha.classList.toggle("ativo", valor === "manha");
  btnTarde.classList.toggle("ativo", valor === "tarde");
}
btnManha.addEventListener("click", function(){ selecionarPeriodo("manha"); });
btnTarde.addEventListener("click", function(){ selecionarPeriodo("tarde"); });

var dataRetiradaInput = document.getElementById("data-retirada");
var hoje = new Date().toISOString().split("T")[0];
dataRetiradaInput.min = hoje;

var form = document.getElementById("form-pedido");
var msgErro = document.getElementById("msg-erro");
var btnEnviar = document.getElementById("btn-enviar");

function mostrarErro(texto){
  msgErro.textContent = texto;
  msgErro.style.display = "block";
}
function limparErro(){
  msgErro.style.display = "none";
}

form.addEventListener("submit", function(evento){
  evento.preventDefault();
  limparErro();

  var nome = document.getElementById("nome").value.trim();
  var telefone = document.getElementById("telefone").value.trim();
  var dataRetirada = dataRetiradaInput.value;

  if (!nome){ mostrarErro("Preencha seu nome."); return; }
  if (!telefone){ mostrarErro("Preencha seu telefone."); return; }
  if (!dataRetirada){ mostrarErro("Escolha a data de retirada."); return; }
  if (!periodoSelecionado){ mostrarErro("Escolha o período: manhã ou tarde."); return; }

  var linhas = itensLista.querySelectorAll(".item-row");
  var itens = [];
  linhas.forEach(function(linha){
    var produto = linha.querySelector(".item-produto").value.trim();
    var qtd = linha.querySelector(".item-qtd").value.trim();
    var unidade = linha.querySelector(".item-unidade").value;
    var obs = linha.querySelector(".item-obs").value.trim();
    if (produto && qtd && Number(qtd) > 0){
      itens.push({ produto: produto, quantidade: Number(qtd), unidade: unidade, observacao: obs });
    }
  });

  if (itens.length === 0){ mostrarErro("Adicione pelo menos um item com quantidade."); return; }

  btnEnviar.disabled = true;
  btnEnviar.textContent = "Enviando...";

  canal.send({
    type: "broadcast",
    event: "pedido",
    payload: {
      nome: nome,
      telefone: telefone,
      data_retirada: dataRetirada,
      periodo: periodoSelecionado,
      itens: itens,
      enviado_em: new Date().toISOString()
    }
  }).then(function(){
    form.style.display = "none";
    document.getElementById("confirmacao").style.display = "block";
  }).catch(function(){
    btnEnviar.disabled = false;
    btnEnviar.textContent = "Enviar pedido";
    mostrarErro("Não foi possível enviar agora. Tente novamente.");
  });
});
</script>

</body>
</html>
